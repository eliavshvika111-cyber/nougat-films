<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nougat Films</title>
<link rel="stylesheet" href="style.css">
<script>
    // חוסם קליק ימני
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // חוסם F12 וכלי פיתוח
    document.onkeydown = function(e) {
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && e.key === 'I') || 
            (e.ctrlKey && e.shiftKey && e.key === 'C') || 
            (e.ctrlKey && e.key === 'u') ||
            (e.ctrlKey && e.shiftKey && e.key === 'J')) {
            return false;
        }
    };
</script>
</head>
<body>
<div class="stars-container">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
</div>

<header class="nav">
  <a class="logo" href="index.html"><span class="logo-play">▶</span> Nougat<i>•</i>Films</a>
  <nav class="nav-links">
    <a href="index.html" class="active" id="nav-home">בית</a>
    <a href="#" id="nav-movies">סרטים</a>
    <a href="#" id="nav-series">סדרות</a>
  </nav>
  <div class="nav-start">
    <button class="icon-btn" id="searchBtn" aria-label="חיפוש">🔍</button>
  </div>
</header>

<div class="searchbar" id="searchbar" hidden>
    <input id="searchInput" type="search" placeholder="חפש סרט או סדרה..." autocomplete="off">
</div>

<main id="rows"></main>

<div id="seeAllModal" class="modal" hidden>
    <div class="modal-content">
        <button class="close-modal" onclick="document.getElementById('seeAllModal').hidden = true">✕</button>
        <h2 id="seeAllTitle" style="margin-bottom: 20px;">כל התוצאות</h2>
        <div id="seeAllGrid" class="grid"></div>
        <div id="pagination" class="pagination"></div>
    </div>
</div>

<footer class="foot">Nougat Films · כל התוכן מובא מ-TMDB</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
