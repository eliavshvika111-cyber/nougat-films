<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

</head>
<body>
<div class="stars-container">
    <div class="stars"></div>
    <div class="stars2"></div>

</div>

<header class="nav">
  <a class="logo" href="index.html"><span class="logo-play">▶</span> Nougat<i>•</i>Films</a>
  <nav class="nav-links"><a href="index.html">בית</a></nav>

<main class="watch">
  <div class="player-wrap" id="playerWrap"></div>
  
  <div class="controls-bar">
    <div class="server-buttons" id="serverButtons"></div>
    <div class="episode-nav-buttons" id="episodeNav" style="display: none;">

        <button id="nextEpisodeBtn" onclick="changeEpisode(1)">פרק הבא</button>
    </div>
  </div>

  <div id="seasonEpisodeSelectors" style="display: none;">
      <div class="season-buttons" id="seasonSelectors"></div>
      <div class="episode-grid" id="episodeGrid"></div>
  </div>

  <section class="info" id="info"></section>
