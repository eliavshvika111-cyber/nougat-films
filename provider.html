<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספק · Nougat Films</title>
<link rel="stylesheet" href="style.css">
<script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.key === 'K' || e.key === 'k' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.keyCode === 75)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) { e.preventDefault(); return false; }
        if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
    }, true);

    window.open = function() { return null; };
    document.addEventListener('click', function(e) {
        var target = e.target.closest('a');
        if (target && target.getAttribute('target') === '_blank') {
            target.removeAttribute('target');
        }
    });
</script>
</head>
<body>
<div class="stars-container">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
</div>

<header class="nav">
  <a class="logo" href="index.html"><span class="logo-play">▶</span> Nougat<i>•</i>Films</a>
  <nav class="nav-links"><a href="index.html">בית</a></nav>
</header>
<main id="rows"></main>

<div id="seeAllModal" class="modal" hidden>
    <div class="modal-content">
        <button class="close-modal" onclick="document.getElementById('seeAllModal').hidden = true">✕</button>
        <h2 id="seeAllTitle" style="margin-bottom: 20px;">כל התוצאות</h2>
        <div id="seeAllGrid" class="grid"></div>
        <div id="pagination" class="pagination"></div>
    </div>
</div>

<script src="data.js"></script>
<script src="provider.js"></script>
</body>
</html>
